<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Roku</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 360px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        .grid-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #333;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background: #555;
        }
        .btn-home {
            background: #4a148c;
        }
        .btn-home:active {
            background: #6a1b9a;
        }
        .btn-power {
            background: #b71c1c;
            grid-column: span 3;
        }
        .btn-power:active {
            background: #c62828;
        }
        .wide-btn {
            grid-column: span 3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Control Roku</h2>
        
        <!-- Campo para la IP de tu Roku -->
        <input type="text" id="rokuIp" placeholder="IP del Roku (ej: 192.168.1.50)">

        <!-- Botón de Apagado / Reposo -->
        <div class="grid-pad">
            <button class="btn-power" onclick="sendCommand('Power')">🔴 Apagar Tele / Reposo</button>
        </div>

        <!-- Pad de Navegación -->
        <div class="grid-pad">
            <button></button>
            <button onclick="sendCommand('Up')">▲</button>
            <button></button>
            
            <button onclick="sendCommand('Left')">◀</button>
            <button class="btn-home" onclick="sendCommand('Home')">🏠</button>
            <button onclick="sendCommand('Right')">▶</button>
            
            <button></button>
            <button onclick="sendCommand('Down')">▼</button>
            <button onclick="sendCommand('Back')">↩</button>
        </div>

        <!-- Acciones Extra -->
        <div class="grid-pad">
            <button class="wide-btn" onclick="sendCommand('Select')">OK / Aceptar</button>
            <button onclick="sendCommand('Play')">⏯ Play</button>
            <button onclick="sendCommand('Rev')">⏪ Rewind</button>
            <button onclick="sendCommand('Fwd')">⏩ Fast Fwd</button>
        </div>
    </div>

    <script>
        function sendCommand(key) {
            const ip = document.getElementById('rokuIp').value.trim();
            
            if (!ip) {
                alert("Por favor, ingresa la dirección IP de tu Roku.");
                return;
            }

            // URL del protocolo de la API externa de Roku (Puerto 8060)
            const url = `http://${ip}:8060/keypress/${key}`;

            fetch(url, {
                method: 'POST'
            })
            .then(response => {
                if (!response.ok) {
                    console.error('Error al enviar el comando');
                }
            })
            .catch(error => {
                console.error('Error de red:', error);
                alert("No se pudo conectar con el Roku. Verifica que la IP sea correcta y estén en la misma red Wi-Fi.");
            });
        }
    </script>
</body>
</html>
